{#
  비밀번호 조건 안내 (로그인·비밀번호 변경 공통)
  - 사용법: {% with pw_input = '입력칸 id' %}{% include '_password_rules.html' %}{% endwith %}
  - 입력할 때마다 조건을 만족하면 초록색 ✓ 로 바뀜. 실제 검사는 app.py 의 is_valid_password 에서 다시 함
#}
<ul class="pw-rules" id="{{ pw_input }}-rules" data-for="{{ pw_input }}">
    <li data-rule="length">{{ t('5~20자') }}</li>
    <li data-rule="special">{{ t('특수문자(!@#$%^&*) 1개 이상 포함') }}</li>
</ul>
<script>
    (function () {
        const list = document.getElementById({{ (pw_input ~ '-rules')|tojson }});
        const input = document.getElementById({{ pw_input|tojson }});
        if (!list || !input) return;
        const checks = {
            length: (v) => v.length >= 5 && v.length <= 20,
            special: (v) => /[!@#$%^&*]/.test(v),
        };
        const update = () => {
            list.querySelectorAll('[data-rule]').forEach((item) => {
                item.classList.toggle('ok', checks[item.dataset.rule](input.value));
            });
        };
        input.addEventListener('input', update);
        update();
    })();
</script>
