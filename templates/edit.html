<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>성적 수정</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>✏️ 과목 정보 수정</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <div class="form-card">
            <form action="{{ url_for('edit', course_id=course.id) }}" method="POST">
                <input type="hidden" name="student_id" value="{{ student_id }}">
                <input type="hidden" name="name" value="{{ name }}">
                <input type="hidden" name="year" value="{{ year }}">

                <div class="form-group" style="margin-bottom:15px;">
                    <label>과목명 선택</label>
                    <select name="name_input" id="edit_course_select" required style="width:100%; padding:8px;">
                        {% for sem, courses in curriculum.items() %}
                            <optgroup label="{{ sem }}">
                                {% for c in courses %}
                                    <option value="{{ c }}" data-credit="{{ course_credits[c] }}" {% if course.name == c %}selected{% endif %}>{{ c }} ({{ course_credits[c] }}학점)</option>
                                {% endfor %}
                            </optgroup>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" style="margin-bottom:15px;">
                    <label>수강 연도 및 학기 선택</label>
                    <div style="display: flex; gap: 10px;">
                        <select name="semester_year" required style="flex: 1; padding: 8px;">
                            {% for y in range(2016, 2037) %}
                                <option value="{{ y }}" {% if y|string == curr_year %}selected{% endif %}>{{ y }}년</option>
                            {% endfor %}
                        </select>
                        <select name="semester_term" required style="flex: 1; padding: 8px;">
                            {% for term in allowed_semesters %}
                                <option value="{{ term }}" {% if term == curr_term %}selected{% endif %}>{{ term }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:15px;">
                    <label>학점 수 (자동 입력)</label>
                    <input type="number" name="credit" id="edit_credit_input" value="{{ course.credit }}" readonly required style="width:100%; padding:8px; background-color: #e9ecef; cursor: not-allowed;">
                </div>
                
                <div class="form-group" style="margin-bottom:15px;">
                    <label>성적 등급</label>
                    <select name="grade" required style="width:100%; padding:8px;">
                        {% for g in grades %}
                            <option value="{{ g }}" {% if course.grade == g %}selected{% endif %}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn-primary">수정 완료</button>
                <a href="{{ url_for('scores', student_id=student_id, name=name, year=year) }}" class="btn-back" style="margin-left:10px;">돌아가기</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('edit_course_select').addEventListener('change', function() {
            var selectedOption = this.options[this.selectedIndex];
            var credit = selectedOption.getAttribute('data-credit');
            document.getElementById('edit_credit_input').value = credit ? credit : '';
        });
    </script>
</body>
</html>
