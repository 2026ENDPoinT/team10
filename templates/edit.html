
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>성적 수정</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>✏️ 과목 정보 수정</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <div class="form-card">
            <form action="{{ url_for('edit', course_id=course.id) }}" method="POST">
                <input type="hidden" name="student_id" value="{{ student_id }}">
                <input type="hidden" name="name" value="{{ name }}">
                <input type="hidden" name="year" value="{{ year }}">

                <div class="form-group" style="margin-bottom:15px;">
                    <label>과목명</label>
                    <input type="text" name="name" value="{{ course.name }}" required style="width:100%; padding:8px;">
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                    <label>수강 학기</label>
                    <input type="text" name="semester" value="{{ course.semester }}" required style="width:100%; padding:8px;">
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                    <label>학점 수</label>
                    <input type="number" name="credit" value="{{ course.credit }}" min="1" required style="width:100%; padding:8px;">
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                    <label>성적 등급</label>
                    <select name="grade" required style="width:100%; padding:8px;">
                        {% for g in grades %}
                            <option value="{{ g }}" {% if course.grade == g %}selected{% endif %}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn-primary">수정 완료</button>
                <a href="{{ url_for('scores', student_id=student_id, name=name, year=year) }}" class="btn-back" style="margin-left:10px;">돌아가기</a>
            </form>
        </div>
    </div>
</body>
</html>
